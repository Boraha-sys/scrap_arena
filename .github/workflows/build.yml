# GitHub에 이 폴더를 올리면 exe(Windows)와 apk(Android)를 클라우드에서 자동으로 빌드합니다.
# 결과물: Actions 탭 → 실행 기록 → Artifacts 에서 내려받기
name: build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm install
        working-directory: desktop
        run: npm install
      - name: build exe
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: ScrapArena-windows
          path: desktop/dist/*.exe

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: build apk
        working-directory: android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ScrapArena-android
          path: android/app/build/outputs/apk/debug/*.apk

  # 웹(PWA) 배포: www 폴더를 GitHub Pages에 올림 → https://<아이디>.github.io/<저장소>/
  pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
